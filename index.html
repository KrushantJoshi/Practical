<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#0e1020" />
  <meta name="description" content="TapForge — three quick, fair one-tap arcade games. No pay-to-win, ever." />
  <title>TapForge — quick arcade games</title>
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" href="./assets/icon.svg" />
  <link rel="apple-touch-icon" href="./assets/icon.svg" />
  <link rel="stylesheet" href="./css/styles.css" />
</head>
<body>
  <!-- HUB -->
  <main id="hub" class="screen active">
    <header class="hub-head">
      <div class="hub-bar">
        <span id="coins" class="coins">🪙 0</span>
        <div class="hub-bar-btns">
          <button id="open-ach" class="chip">🏆</button>
          <button id="open-themes" class="chip">🎨</button>
          <button id="open-settings" class="chip">⚙️</button>
        </div>
      </div>
      <h1 class="logo">Tap<span>Forge</span></h1>
      <p class="sub">Quick games. Fair rules. No pay-to-win.</p>
    </header>
    <section id="grid" class="grid"></section>
    <button id="noads" class="noads">Remove ads — one-time ❤️</button>
    <footer class="hub-foot">Built for players, not whales.</footer>
  </main>

  <!-- PLAY -->
  <section id="play" class="screen play">
    <div class="topbar">
      <button id="back" class="icon-btn">‹ Back</button>
      <span id="game-title" class="game-title"></span>
      <button id="sound-toggle" class="icon-btn">🔊</button>
    </div>
    <canvas id="canvas"></canvas>
    <div id="dom-root" class="dom-root" style="display:none"></div>
  </section>

  <script type="module" src="./js/app.js"></script>
</body>
</html>
